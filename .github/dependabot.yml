version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports typescript <6.1; a newer compiler breaks the type-aware lint.
      # Bump both together, by hand, once typescript-eslint's peer range allows it.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The Node types follow the Node major in .nvmrc, which Render runs.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
